# Netlify configuration for Angular SPA
# This configuration ensures that all non-file routes are redirected to index.html
# allowing Angular's client-side router to handle the routing

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache configuration
[build]
command = "npm run build"
publish = "dist/renthub/browser"

# Headers for caching static assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
